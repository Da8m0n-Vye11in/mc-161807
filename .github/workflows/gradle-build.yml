name: Gradle Build

on:
  push:
    branches: [ 'fix/compile-errors' ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew || true

      - name: Run Gradle build and save logs
        run: |
          set -e
          chmod +x ./gradlew || true
          echo "Running Gradle build, saving output to build.log"
          ./gradlew clean build --no-daemon > build.log 2>&1 || true
          echo "Gradle exit code: $?" > exitcode.txt

      - name: Upload build logs and artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build.log
            exitcode.txt
            build/libs/**
